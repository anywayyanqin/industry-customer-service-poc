<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程学习｜产业服务平台</title><style>

m)}.learning{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:20px}.lesson-card,.practice{border:1px solid var(--l);padding:20px;background:#fbfdff}.video{height:225px;display:grid;place-items:center;background:linear-gradient(135deg,#173f70,#0871df);color:#fff;margin-top:15px}.play{width:52px;height:52px;border:1px solid #fff;border-radius:50%;display:grid;place-items:center;margin:auto}.points{display:grid;gap:8px}.points span{padding:10px 12px;background:#f3f6fa}.quiz{margin-top:18px;padding:20px;border:1px solid #cdddf0;background:#f7faff}.answers{display:grid;gap:8px;margin:13px 0}.answers button{text-align:left;border:1px solid #d7e1ec;background:#fff;padding:10px 12px;cursor:pointer}.answers button.correct{border-color:#22a17a;background:#eaf8f3;color:#147457}.answers button.wrong{border-color:#e66b65;background:#fff0ef;color:#b13d39}.primary{border:0;background:var(--b);color:#fff;padding:10px 16px;cursor:pointer}.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.case{border:1px solid var(--l);padding:18px;cursor:pointer}.case:hover{border-color:#82a9dc;box-shadow:0 6px 16px rgba(36,74,122,.08)}.case b{display:block;margin:7px 0}.case span{font-size:12px;color:var(--b)}.case p{color:var(--m)}.result{margin-top:16px;padding:14px;background:#edf6ff;color:#315a89;display:none}.result.show{display:block}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;background:#173f70;color:#fff;padding:10px 16px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:950px){.header nav{display:none}.layout,.learning{grid-template-columns:1fr}.case-grid{grid-template-columns:1fr}.crumb,main{width:calc(100% - 28px)}}
</style></head><body><div class="top"><span>国泰君安期货　市场洞察　业务办理　活动中心</span><span>服务热线 400-800-2026</span></div><header class="header"><div class="logo"><span class="mark">国泰</span><b>产业服务平台</b><em>产业版</em></div><nav><a href="#">首页</a><a href="#">产业咨询</a><a class="active" href="#">基础服务</a><a href="#">智能交易</a><a href="#">投研支持</a></nav><button class="work" data-go="index.html?v=20260821-31#workbench">我的工作台</button></header><div class="crumb"><button data-go="basic-service-home.html">基础服务</button><span>/</span><button data-go="training-center.html">培训课程</button><span>/</span><b id="crumb-title"></b><button class="home" data-go="basic-service-home.html">← 返回基础服务首页</button></div><main><section class="hero"><small>培训课程 · 互动学习</small><h1 id="hero-title"></h1><p id="hero-desc"></p><div class="hero-meta"><span id="meta-chapters"></span><span id="meta-duration"></span><span>课程进度可保存至工作台</span></div></section><div class="layout"><aside class="side"><h3>课程章节</h3><div id="side-list"></div><button data-go="training-center.html">‹ 返回课程中心</button></aside><section class="content"><h2 id="lesson-title"></h2><p id="lesson-desc"></p><div id="risk-view"><div class="learning"><div class="lesson-card"><b>微课内容</b><div class="video"><div><div class="play">▶</div><p>课程视频演示</p></div></div></div><div class="practice"><b>本节知识要点</b><div class="points" id="points"></div></div></div><div class="quiz"><b>情景判断</b><p>某生产企业担心未来三个月原材料价格上涨，并计划锁定采购成本。这首先属于哪类风险管理问题？</p><div class="answers"><button data-answer="wrong">短期投资收益管理</button><button data-answer="correct">采购价格风险敞口管理</button><button data-answer="wrong">企业信用评级管理</button></div><button class="primary" data-complete>完成本节</button><div class="result" id="quiz-result"></div></div></div><div id="case-view" hidden><div class="case-grid" id="case-grid"></div><div class="quiz"><b id="case-title">选择一个案例查看</b><p id="case-detail">案例将展示业务背景、风险目标、工具选择、执行步骤及注意事项。</p><div class="result show" id="case-result">工具应用应始终服务于真实经营风险管理目标，并与现货规模、周期和定价方式相匹配。</div></div></div></section></div></main><div class="toast" id="toast"></div><script>
const data={risk:{title:'风险管理基础知识',desc:'从企业真实经营场景出发，系统理解风险识别、敞口分析、套期保值逻辑与常用衍生工具。',duration:'约 3 小时',chapters:[['认识企业价格风险','识别采购、库存和销售环节的价格波动风险'],['风险敞口测算','明确数量、时间、价格和方向'],['套期保值基本逻辑','理解现货与衍生品的风险对冲关系'],['基差风险与效果评价','认识套保并非消除全部风险'],['常用工具基础','了解期货、期权与场外工具'],['制度与执行准备','建立目标、授权、限额和报告机制']]},cases:{title:'衍生品工具应用实例',desc:'通过采购、库存、销售等产业业务场景，理解期货、期权和组合工具的适用方式与边界。',duration:'约 2.5 小时',chapters:[['采购成本管理','原材料价格上涨风险与买入套保'],['库存价值管理','库存跌价风险与卖出套保'],['销售利润管理','远期销售价格风险管理'],['期权保护策略','保留有利价格变化的保护方案']]}};let type=location.hash.includes('derivative')?'cases':'risk',d=data[type],active=0;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];$('#hero-title').textContent=$('#crumb-title').textContent=d.title;$('#hero-desc').textContent=d.desc;$('#meta-chapters').textContent=d.chapters.length+' 个学习单元';$('#meta-duration').textContent=d.duration;function render(){d=data[type];$('#side-list').innerHTML=d.chapters.map((x,i)=>`<button class="${i===active?'active':''}" data-unit="${i}">${i+1}. ${x[0]}</button>`).join('');$('#lesson-title').textContent=d.chapters[active][0];$('#lesson-desc').textContent=d.chapters[active][1];$('#points').innerHTML=['识别业务背景与风险来源','明确管理目标和风险边界','理解适用方法与实施条件','形成可执行的内部行动'].map(x=>`<span>${x}</span>`).join('');$('#risk-view').hidden=type!=='risk';$('#case-view').hidden=type!=='cases';if(type==='cases')$('#case-grid').innerHTML=d.chapters.map((x,i)=>`<article class="case" data-case="${i}"><span>案例 ${String(i+1).padStart(2,'0')}</span><b>${x[0]}</b><p>${x[1]}</p><em>查看案例　›</em></article>`).join('')}render();function save(progress){const key='basicServiceCourses',id=type==='risk'?'risk-foundation':'derivative-cases',url='course-experience.html#'+(type==='risk'?'risk':'derivative');let list=[];try{list=JSON.parse(localStorage.getItem(key)||'[]')}catch{};const previous=list.find(x=>x.id===id);progress=Math.max(progress,Number(previous?.progress||0));const item={id,title:d.title,category:'培训课程',progress,url,updatedAt:'2026-08-20'};list=[item,...list.filter(x=>x.id!==id)];localStorage.setItem(key,JSON.stringify(list))}function note(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}document.addEventListener('click',e=>{const go=e.target.closest('[data-go]')?.dataset.go;if(go)location.href=go;const u=e.target.closest('[data-unit]')?.dataset.unit;if(u!==undefined){active=Number(u);render()}const ans=e.target.closest('[data-answer]');if(ans){$$('[data-answer]').forEach(b=>b.className='');ans.classList.add(ans.dataset.answer);$('#quiz-result').textContent=ans.dataset.answer==='correct'?'回答正确：应先识别采购价格风险敞口，再确定管理目标和工具。':'答案不正确，请从企业真实采购业务与价格风险方向重新判断。';$('#quiz-result').classList.add('show')}if(e.target.closest('[data-complete]')){save(Math.round((active+1)/d.chapters.length*100));if(active<d.chapters.length-1){active++;render()}note('学习进度已保存至工作台')}const c=e.target.closest('[data-case]');if(c){active=Number(c.dataset.case);const x=d.chapters[active];$('#case-title').textContent=x[0];$('#case-detail').textContent=x[1]+'。建议结合现货数量、业务周期、基差变化、资金占用和内部授权综合设计方案。';save(Math.round((active+1)/d.chapters.length*100))}});save(0);
</script><script src="service-navigation.js?v=20260824-2"></script></body></html>
