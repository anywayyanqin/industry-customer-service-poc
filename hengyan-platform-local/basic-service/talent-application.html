<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人才服务申请｜产业服务平台</title><link rel="stylesheet" href="activity-flow.css?v=20260821-1"></head><body><div class="top"><span>国泰君安期货　市场洞察　业务办理</span><span>服务热线 400-800-2026</span></div><header class="header"><div class="logo" data-go="basic-service-home.html"><span class="mark">国泰</span><b>产业服务平台</b><em>产业版</em></div><nav><a href="#">首页</a><a href="#">产业咨询</a><a class="active" href="basic-service-home.html">基础服务</a><a href="#">智能交易</a><a href="#">投研支持</a></nav><button class="work" data-go="index.html?v=20260821-31#workbench">我的工作台</button></header><div class="crumb"><a href="basic-service-home.html">基础服务</a><span>›</span><a href="service-hubs.html#talent">人才服务中心</a><span>›</span><b id="crumb-title"></b><span>›</span><b>申请表单</b></div><main class="page"><section class="hero"><small>基础服务 · 人才服务申请</small><h1 id="page-title"></h1><p>填写企业需求与服务期望，提交后可在“我的工作台”查看受理和资源对接进展。</p></section><form class="form-shell" id="form"><div class="form-head"><h2>申请信息</h2><p id="form-tip"></p></div><section class="form-section"><h3>企业及联系人</h3><div class="form-grid"><div class="field"><label><span class="required">*</span> 企业名称</label><input name="company" required></div><div class="field"><label><span class="required">*</span> 联系人</label><input name="contact" required></div><div class="field"><label><span class="required">*</span> 联系电话</label><input name="phone" required></div><div class="field"><label>所在部门及职务</label><input name="position"></div></div></section><section class="form-section"><h3>需求详情</h3><div class="form-grid"><div class="field"><label><span class="required">*</span> 需求方向</label><input name="direction" required id="direction"></div><div class="field"><label><span class="required">*</span> 期望时间</label><input name="expected" required type="date"></div><div class="field full"><label><span class="required">*</span> 详细说明</label><textarea name="demand" required id="demand"></textarea></div></div></section><section class="form-section"><h3>附加材料</h3><div class="upload"><input id="file" type="file" multiple><label for="file">上传附加材料</label><p>可上传岗位说明、企业介绍或交流方案（原型演示）。</p></div></section><div class="actions"><button class="save" type="button" id="save">保存草稿</button><button class="submit" type="submit">提交申请</button></div></form></main><div class="toast" id="toast"></div><script>const service=new URLSearchParams(location.search).get('service')||'talent-demand',config=service==='exchange-internship'?{title:'双向人员交流或实习',tip:'请说明交流对象、实践目标、周期与保障条件。',direction:'人员交流或产业实习',placeholder:'请说明参与对象、交流周期、主要内容及期望成果'}:{title:'专业人才输送',tip:'请说明岗位方向、人数、经验要求和到岗安排。',direction:'风险管理专业人才需求',placeholder:'请说明岗位职责、专业方向、人数、经验及资质要求'};document.querySelector('#page-title').textContent=document.querySelector('#crumb-title').textContent=config.title;document.querySelector('#form-tip').textContent=config.tip;document.querySelector('#direction').value=config.direction;document.querySelector('#demand').placeholder=config.placeholder;const form=document.querySelector('#form'),draft='talentDraft-'+service;function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}function data(){return Object.fromEntries(new FormData(form).entries())}document.querySelector('#save').onclick=()=>{localStorage.setItem(draft,JSON.stringify(data()));toast('草稿已保存')};form.onsubmit=e=>{e.preventDefault();let list=[];try{list=JSON.parse(localStorage.getItem('basicServiceTalent')||'[]')}catch{};list.unshift({id:'RC'+Date.now(),serviceId:service,title:config.title,type:'人才服务',status:'已提交',time:new Date().toLocaleString('zh-CN'),url:'service-hubs.html?service='+service+'#talent',detail:data()});localStorage.setItem('basicServiceTalent',JSON.stringify(list));localStorage.removeItem(draft);toast('申请已提交，正在进入工作台');setTimeout(()=>location.href='index.html?v=20260821-31#workbench',700)};document.addEventListener('click',e=>{const go=e.target.closest('[data-go]')?.dataset.go;if(go)location.href=go})</script><script src="/login-phone-prefill.js?v=2"></script></body></html>
