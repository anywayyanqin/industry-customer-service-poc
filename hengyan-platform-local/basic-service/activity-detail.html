<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动详情｜产业服务平台</title><link rel="stylesheet" href="activity-flow.css?v=20260821-1"></head><body><div class="top"><span>国泰君安期货　市场洞察　业务办理　活动中心</span><span>服务热线 400-800-2026</span></div><header class="header"><div class="logo" data-go="basic-service-home.html"><span class="mark">国泰</span><b>产业服务平台</b><em>产业版</em></div><nav><a href="#">首页</a><a href="#">产业咨询</a><a class="active" href="basic-service-home.html">基础服务</a><a href="#">智能交易</a><a href="#">投研支持</a></nav><button class="work" data-go="index.html?v=20260821-31#workbench">我的工作台</button></header><div class="crumb"><a href="basic-service-home.html">基础服务</a><span>›</span><a href="service-hubs.html#activity">活动与调研中心</a><span>›</span><b>活动详情</b></div><main class="page"><section class="hero"><small id="type"></small><h1 id="title"></h1><p id="desc"></p></section><div class="layout"><article class="panel"><h2 class="section-title">活动信息</h2><div class="facts" id="facts"></div><h2 class="section-title">活动议程</h2><div class="agenda" id="agenda"></div></article><aside><section class="side-card"><h2>报名信息</h2><p id="audience"></p><button class="primary" id="apply">立即预约</button><button class="secondary" data-go="service-hubs.html#activity">返回活动中心</button></section><section class="side-card"><h2>报名须知</h2><ul id="notice"></ul></section></aside></div></main><script src="activity-data.js?v=20260821-1"></script><script>const id=new URLSearchParams(location.search).get('id')||'policy-live',a=getBasicServiceActivity(id),$=s=>document.querySelector(s);$('#type').textContent='基础服务 · 活动与调研 · '+a.type;$('#title').textContent=a.title;$('#desc').textContent=a.desc;$('#facts').innerHTML=[['活动时间',a.date],['活动地点',a.place],['报名状态',a.capacity],['主讲/组织',a.speaker]].map(x=>`<div class="fact"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');$('#agenda').innerHTML=a.agenda.map((x,i)=>`<div><b>${String(i+1).padStart(2,'0')}</b><span>${x}</span></div>`).join('');$('#audience').textContent='适合对象：'+a.audience;$('#notice').innerHTML=a.notice.map(x=>`<li>${x}</li>`).join('');$('#apply').onclick=()=>location.href='activity-application.html?id='+a.id;document.addEventListener('click',e=>{const go=e.target.closest('[data-go]')?.dataset.go;if(go)location.href=go});</script></body></html>
