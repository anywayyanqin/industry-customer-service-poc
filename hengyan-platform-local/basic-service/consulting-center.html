<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>咨询服务中心｜产业服务平台</title>
  <style>
    :root{--b:#075fe6;--n:#173f70;--i:#172b45;--m:#687b92;--l:#dce5ef;--bg:#f3f6fa}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:14px/1.7 "Microsoft YaHei",sans-serif}button{font:inherit}
    .top{height:34px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;background:#fff;color:#78889b;border-bottom:1px solid #e7ebf0}
    .header{height:72px;padding:0 5vw;display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--l)}.logo{display:flex;align-items:center;gap:10px}.mark{padding:9px 7px;background:var(--b);color:#fff}.logo b{font-size:19px}.logo em{padding:3px 7px;background:#edf4ff;color:var(--b);font-style:normal}.header nav{display:flex;gap:27px;margin-left:52px}.header a{color:#34465b;text-decoration:none}.header .active{color:var(--b);font-weight:700}.work{margin-left:auto;border:0;background:var(--b);color:#fff;padding:12px 20px;cursor:pointer}
    .crumb,main{width:calc(100% - 64px);max-width:1380px;margin:auto}.crumb{color:#78889b}.crumb a{color:var(--b);text-decoration:none}
    .hero{display:flex;align-items:center;padding:18px 28px;background:linear-gradient(118deg,#075fe6,#3b83df 70%,#83b8ed);color:#fff}.hero h1{margin:0;font-size:24px}
    .services{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:18px 0 24px}.service-card{position:relative;display:flex;flex-direction:column;min-width:0;padding:24px 22px 18px;border:1px solid var(--l);border-radius:8px;background:linear-gradient(145deg,#fff 50%,#edf4ff);color:var(--n);text-decoration:none;transition:border-color .2s,transform .2s,box-shadow .2s;overflow:hidden}.service-card:nth-child(2){background:linear-gradient(145deg,#fff 50%,#edf7fa)}.service-card:nth-child(3){background:linear-gradient(145deg,#fff 50%,#f1f2fc)}.service-card:nth-child(4){background:linear-gradient(145deg,#fff 50%,#edf5fb)}.service-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.service-card svg{width:42px;height:42px;padding:8px;background:#eaf2ff;border-radius:10px;fill:none;stroke:var(--b);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.service-card-top>span{font-size:12px;color:#8b9db2;letter-spacing:2px}.service-card h2{margin:0;font-size:19px;line-height:1.5}.service-card p{margin:10px 0 24px;color:var(--m);font-size:12px}.service-card-entry{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px;border-top:1px solid #dce6f2;font-size:13px;color:var(--b)}.service-card-entry i{font-size:20px;font-style:normal;line-height:1}.service-card:hover{border-color:#7fa9e3;transform:translateY(-3px);box-shadow:0 10px 24px rgba(35,83,143,.08)}.service-card:focus-visible{outline:2px solid var(--b);outline-offset:3px}
    @media(max-width:1100px){.header nav{display:none}}
    @media(max-width:1000px){.services{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:720px){.crumb,main{width:calc(100% - 28px)}}
    @media(max-width:600px){.services{grid-template-columns:1fr;gap:10px}.service-card{min-height:72px;padding:16px 18px}.header{height:auto;min-height:72px;flex-wrap:wrap;gap:10px;padding:12px 14px}.work{padding:10px 12px}.top{height:auto;flex-wrap:wrap;gap:4px;padding:6px 14px}}
  </style>
</head>
<body>
  <div class="top"><span>国泰君安期货　市场洞察　业务办理</span><span>服务热线 400-800-2026</span></div>

      <a class="service-card" href="basic-service-home.html#content/internal-control"><div class="service-card-top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 8 3v6c0 5-4 8-8 11-4-3-8-6-8-11V5Z"/><path d="m8 12 3 3 5-6"/></svg><span>03</span></div><h2>内控管理制度建设</h2><p>制度框架 · 流程与职责</p><span class="service-card-entry">查看指引<i aria-hidden="true">↗</i></span></a>

    </section>
  </main>
