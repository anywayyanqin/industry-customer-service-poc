<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动预约申请｜产业服务平台</title><link rel="stylesheet" href="activity-flow.css?v=20260821-1"></head><body><div class="top"><span>国泰君安期货　市场洞察　业务办理　活动中心</span><span>服务热线 400-800-2026</span></div><header class="header"><div class="logo" data-go="basic-service-home.html"><span class="mark">国泰</span><b>产业服务平台</b><em>产业版</em></div><nav><a href="#">首页</a><a href="#">产业咨询</a><a class="active" href="basic-service-home.html">基础服务</a><a href="#">智能交易</a><a href="#">投研支持</a></nav><button class="work" data-go="index.html?v=20260821-31#workbench">我的工作台</button></header><div class="crumb"><a href="basic-service-home.html">基础服务</a><span>›</span><a href="service-hubs.html#activity">活动与调研中心</a><span>›</span><a id="detail-link">活动详情</a><span>›</span><b>预约申请</b></div><main class="page"><section class="hero"><small>基础服务 · 活动预约</small><h1>活动预约申请</h1><p>填写参会信息并提交预约。提交后可在“我的工作台”持续查看预约状态与活动通知。</p></section><form class="form-shell" id="form"><div class="form-head"><h2>所选活动</h2><p>请确认活动信息后填写报名资料。</p></div><section class="form-section"><div class="activity-summary"><div><b id="activity-title"></b><span id="activity-info"></span></div><a id="change-link">返回修改</a></div></section><section class="form-section"><h3>企业及联系人信息</h3><div class="form-grid"><div class="field"><label><span class="required">*</span> 企业名称</label><input name="company" required placeholder="请输入企业全称"></div><div class="field"><label><span class="required">*</span> 联系人姓名</label><input name="contact" required placeholder="请输入联系人姓名"></div><div class="field"><label><span class="required">*</span> 联系电话</label><input name="phone" required placeholder="请输入联系电话"></div><div class="field"><label><span class="required">*</span> 职务</label><input name="position" required placeholder="请输入所在部门及职务"></div><div class="field"><label><span class="required">*</span> 参与人数</label><select name="people" required><option>1 人</option><option>2—5 人</option><option>6—10 人</option><option>10 人以上</option></select></div><div class="field"><label>联系邮箱</label><input name="email" type="email" placeholder="用于接收活动资料"></div><div class="field full"><label>参与目的与关注议题</label><textarea name="demand" placeholder="请说明希望重点了解或交流的内容"></textarea></div></div></section><section class="form-section"><h3>附加材料</h3><div class="upload"><input id="file" type="file" multiple><label for="file">上传附加材料</label><p>可选，用于补充企业介绍或交流议题，单个文件不超过 20MB（原型演示）。</p></div><div class="tip">提交即表示所填信息真实有效，并同意平台用于本次活动组织与联络。</div></section><div class="actions"><button class="save" type="button" id="save">保存草稿</button><button class="submit" type="submit">提交预约</button></div></form></main><div class="toast" id="toast"></div><script src="activity-data.js?v=20260821-1"></script><script>const id=new URLSearchParams(location.search).get('id')||'policy-live',a=getBasicServiceActivity(id),form=document.querySelector('#form'),key='basicServiceActivityDraft-'+id;document.querySelector('#activity-title').textContent=a.title;document.querySelector('#activity-info').textContent=a.date+'　·　'+a.place+'　·　'+a.type;document.querySelector('#detail-link').href=document.querySelector('#change-link').href='activity-detail.html?id='+id;function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function collect(){return Object.fromEntries(new FormData(form).entries())}function restore(){try{const d=JSON.parse(localStorage.getItem(key)||'{}');Object.entries(d).forEach(([k,v])=>{if(form.elements[k])form.elements[k].value=v})}catch{}}restore();document.querySelector('#save').onclick=()=>{localStorage.setItem(key,JSON.stringify(collect()));toast('草稿已保存')};form.onsubmit=e=>{e.preventDefault();const data=collect(),records=(()=>{try{return JSON.parse(localStorage.getItem('basicServiceActivities')||'[]')}catch{return[]}})();records.unshift({id:'HD'+Date.now(),serviceId:a.id,title:a.title,type:a.type,status:'已提交',time:new Date().toLocaleString('zh-CN'),url:'activity-detail.html?id='+a.id,detail:data});localStorage.setItem('basicServiceActivities',JSON.stringify(records));localStorage.removeItem(key);toast('预约已提交，正在进入我的工作台');setTimeout(()=>location.href='index.html?v=20260821-31#workbench',700)};document.addEventListener('click',e=>{const go=e.target.closest('[data-go]')?.dataset.go;if(go)location.href=go});</script><script src="/login-phone-prefill.js?v=2"></script></body></html>
